<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>100-Mile Race Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --bg-elevated: #14161b;
    --bg-card: #1a1d24;
    --border: #262932;
    --border-bright: #353946;
    --text: #e8e6e1;
    --text-dim: #8a8a8a;
    --text-muted: #5a5a60;
    --accent: #ff6b3d;
    --accent-glow: rgba(255, 107, 61, 0.18);
    --green: #6ee7a8;
    --yellow: #f5c451;
    --red: #ff5959;
    --blue: #5ec8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255, 107, 61, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(94, 200, 255, 0.05) 0%, transparent 40%);
    background-attachment: fixed;
    padding: 32px 40px 80px;
  }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px; margin-bottom: 32px;
    flex-wrap: wrap; gap: 24px;
  }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand-meta {
    display: flex; gap: 14px; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--text-muted);
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 800;
    font-size: 44px; line-height: 1; letter-spacing: -0.025em;
  }
  h1 em { font-style: italic; color: var(--accent); font-weight: 600; }
  a.map-link {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px;
  }
  a.map-link:hover { color: var(--accent); border-color: var(--accent); }
  .race-clock { text-align: right; display: flex; flex-direction: column; gap: 4px; }
  .race-clock .label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .race-clock .time {
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;
    color: var(--text); letter-spacing: -0.02em;
  }

  .cutoffs {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 4px; padding: 18px 24px; margin-bottom: 32px;
    display: grid; grid-template-columns: auto 1fr auto auto auto;
    gap: 32px; align-items: center;
  }
  .cutoffs-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .cutoff-item { display: flex; flex-direction: column; gap: 2px; }
  .cutoff-item .v { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
  .cutoff-item .l { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .cutoff-item.warn .v { color: var(--yellow); }
  .cutoff-item.danger .v { color: var(--red); }

  .runners { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 1100px) { .runners { grid-template-columns: 1fr; } }

  .runner {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; position: relative;
  }
  .runner::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .runner-head {
    padding: 24px 28px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
  }
  .runner-name {
    font-family: 'Fraunces', serif; font-size: 32px;
    font-weight: 600; letter-spacing: -0.02em;
  }
  .runner-bib {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); letter-spacing: 0.1em;
    text-transform: uppercase; margin-top: 4px;
  }
  .status-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 2px; border: 1px solid currentColor;
  }
  .status-onpace { color: var(--green); }
  .status-tight { color: var(--yellow); }
  .status-offpace { color: var(--red); }
  .status-notstarted { color: var(--text-muted); }

  .stats {
    display: grid; grid-template-columns: repeat(8, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 16px 14px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .stat:last-child { border-right: none; }
  .stat.live .value { color: var(--accent); }
  .stat.live-course .value { color: var(--accent); }
  .stat.live-pit .value { color: var(--green); }
  .stat.live-course .label, .stat.live-pit .label {
    animation: liveBlink 2s ease-in-out infinite;
  }
  @keyframes liveBlink {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .stat .label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-muted);
  }
  .stat .value {
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--text);
  }
  .stat .sub { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .intake { padding: 20px 28px 24px; border-bottom: 1px solid var(--border); }
  .intake-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 14px;
  }
  .intake-row {
    display: grid; grid-template-columns: 90px 1fr auto auto;
    gap: 14px; align-items: center; padding: 8px 0;
  }
  .intake-row .name { font-size: 13px; color: var(--text-dim); }
  .bar-track {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; position: relative;
  }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .bar-fill.good { background: var(--green); }
  .bar-fill.warn { background: var(--yellow); }
  .bar-fill.low { background: var(--red); }
  .intake-row .num {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    font-weight: 600; text-align: right; min-width: 90px;
  }
  .intake-row .target {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); min-width: 60px; text-align: right;
  }

  .laps { padding: 20px 28px 28px; }
  .laps-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px;
  }
  .laps-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .laps-grid {
    display: grid; grid-template-columns: repeat(10, 1fr);
    gap: 6px; margin-bottom: 16px;
  }
  .lap-cell {
    aspect-ratio: 1; background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: 3px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'JetBrains Mono', monospace; cursor: default;
  }
  .lap-cell .n { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
  .lap-cell .t { font-size: 11px; font-weight: 700; }
  .lap-cell.done { background: rgba(110, 231, 168, 0.08); border-color: rgba(110, 231, 168, 0.4); }
  .lap-cell.done .t { color: var(--green); }
  .lap-cell.slow { background: rgba(245, 196, 81, 0.08); border-color: rgba(245, 196, 81, 0.4); }
  .lap-cell.slow .t { color: var(--yellow); }
  .lap-cell.danger { background: rgba(255, 89, 89, 0.08); border-color: rgba(255, 89, 89, 0.4); }
  .lap-cell.danger .t { color: var(--red); }
  .lap-cell.current {
    background: var(--accent-glow); border-color: var(--accent);
    animation: currentPulse 2s ease-in-out infinite;
  }
  .lap-cell.current .t { color: var(--accent); }
  @keyframes currentPulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { box-shadow: 0 0 0 4px transparent; }
  }

  .laplog { border-top: 1px solid var(--border); margin-top: 8px; }
  .laplog-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 2px 6px;
    cursor: pointer; user-select: none;
  }
  .laplog-head:hover .laplog-head-toggle { color: var(--accent); }
  .laplog-head-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; }
  .laplog-head-toggle { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }
  .laplog-head-toggle::before { content: '▼ '; }
  .laplog.collapsed .laplog-head-toggle::before { content: '▶ '; }
  .laplog.collapsed tr.lap-old, .laplog.collapsed tr.note-old { display: none; }
  .laplog.collapsed .when-expanded, .laplog:not(.collapsed) .when-collapsed { display: none; }
  .laplog table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .laplog th {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
    text-align: left; padding: 14px 8px 10px; font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  .laplog th:first-child { padding-left: 0; }
  .laplog th.num, .laplog td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .laplog td { padding: 12px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .laplog td:first-child { padding-left: 0; }
  .laplog tr:last-child td { border-bottom: none; }
  .laplog .lap-num {
    font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600;
    color: var(--accent); width: 30px;
  }
  .laplog tr.lap-row:has(+ tr.note-row) td { border-bottom: none; padding-bottom: 6px; }
  .laplog tr.note-row td {
    padding: 0 8px 12px 8px; padding-left: 38px;
    font-size: 11px; color: var(--text-dim); line-height: 1.5;
    border-bottom: 1px solid var(--border);
  }
  .laplog tr.note-row:last-child td { border-bottom: none; }
  .laplog tr.empty td { color: var(--text-muted); font-style: italic; }

  footer {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
  }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }

  .error-banner {
    background: rgba(255, 89, 89, 0.1); border: 1px solid var(--red);
    color: var(--red); padding: 16px; border-radius: 4px; margin-bottom: 24px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }

  .race-stats {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 28px 32px;
    margin-top: 32px; position: relative; overflow: hidden;
  }
  .race-stats[hidden] { display: none; }
  .race-stats::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--green), transparent);
  }
  .race-stats h2 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 30px; letter-spacing: -0.02em; margin-bottom: 4px;
  }
  .race-stats h2 em { font-style: italic; color: var(--green); font-weight: 600; }
  .race-stats .subtitle {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); letter-spacing: 0.18em;
    text-transform: uppercase; margin-bottom: 18px;
  }
  .race-stats ul { list-style: none; padding: 0; margin: 0; }
  .race-stats li {
    padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 14px; line-height: 1.55; color: var(--text-dim);
  }
  .race-stats li:last-child { border-bottom: none; }
  .race-stats li strong { color: var(--text); font-weight: 600; }
  .race-stats li em { color: var(--accent); font-style: normal; font-weight: 600; }

  .print-trigger {
    margin-top: 24px;
    display: flex; justify-content: center;
  }
  .print-trigger button {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600;
    color: var(--text-dim); background: transparent;
    border: 1px solid var(--border-bright);
    padding: 12px 20px; border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .print-trigger button:hover { color: var(--accent); border-color: var(--accent); }
  .print-trigger button:active { transform: scale(0.98); }

  @media (max-width: 1300px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .stat:nth-child(4n) { border-right: none; }
    .stat:nth-last-child(-n+4) { border-bottom: none; }
  }
  @media (max-width: 800px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .stat:nth-child(4n) { border-right: 1px solid var(--border); }
    .stat:nth-child(3n) { border-right: none; }
    .stat:nth-last-child(-n+2) { border-bottom: none; }
  }
  @media (max-width: 500px) {
    body { padding: 20px 16px 60px; }
    h1 { font-size: 32px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat { padding: 14px 12px; }
    .stat:nth-child(3n) { border-right: 1px solid var(--border); }
    .stat:nth-child(2n) { border-right: none; }
    .stat:nth-last-child(-n+2) { border-bottom: none; }
    .cutoffs { grid-template-columns: 1fr 1fr; gap: 16px; }
    .laps-grid { grid-template-columns: repeat(5, 1fr); }
    .laplog table { font-size: 11px; }
    .laplog th, .laplog td { padding: 8px 4px; }
  }

  @media print {
    @page { size: letter portrait; margin: 0.5in; }

    *, *::before, *::after {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      animation: none !important;
      transition: none !important;
    }

    html, body {
      background: white !important;
      background-image: none !important;
      color: #111 !important;
      font-size: 10.5pt;
    }
    body { padding: 0 !important; }

    /* Strip interactive / animated chrome */
    a.map-link, .pulse, .laplog-head-toggle { display: none !important; }
    .laplog-head { cursor: default !important; padding: 12px 2px 6px; }

    /* Header */
    header {
      border-bottom: 1px solid #999;
      padding-bottom: 12pt; margin-bottom: 14pt;
    }
    h1 { color: #111 !important; font-size: 24pt; }
    h1 em { color: #c44a18 !important; }
    .brand-meta { color: #555 !important; }
    .race-clock .label { color: #555 !important; }
    .race-clock .time { color: #111 !important; font-size: 18pt; }

    /* Cutoffs */
    .cutoffs {
      background: #f6f6f6 !important;
      border: 1px solid #bbb !important;
      padding: 12pt 16pt; margin-bottom: 14pt;
      page-break-inside: avoid;
    }
    .cutoffs-label { color: #555 !important; }
    .cutoff-item .v { color: #111 !important; }
    .cutoff-item .l { color: #555 !important; }
    .cutoff-item.warn .v { color: #8a6700 !important; }
    .cutoff-item.danger .v { color: #a82626 !important; }

    /* Runners — stacked, no split across pages */
    .runners { display: block !important; }
    .runner {
      background: white !important;
      border: 1px solid #999 !important;
      page-break-inside: avoid;
      margin-bottom: 16pt;
    }
    .runner::before { display: none; }
    .runner-head {
      padding: 14pt 16pt 10pt;
      border-bottom: 1px solid #ddd !important;
    }
    .runner-name { color: #111 !important; font-size: 22pt; }
    .runner-bib { color: #555 !important; }

    /* Status pills (recolor for paper) */
    .status-onpace { color: #1f6e3a !important; border-color: #1f6e3a !important; }
    .status-tight { color: #8a6700 !important; border-color: #8a6700 !important; }
    .status-offpace { color: #a82626 !important; border-color: #a82626 !important; }
    .status-notstarted { color: #555 !important; border-color: #555 !important; }

    /* Stat grid */
    .stats {
      grid-template-columns: repeat(4, 1fr) !important;
      border-bottom: 1px solid #ddd !important;
    }
    .stat {
      padding: 10pt 12pt;
      border-right: 1px solid #ddd !important;
      border-bottom: 1px solid #ddd !important;
    }
    .stat:nth-child(4n) { border-right: none !important; }
    .stat:nth-last-child(-n+4) { border-bottom: none !important; }
    .stat .label { color: #555 !important; }
    .stat .value, .stat.live .value, .stat.live-course .value { color: #111 !important; }
    .stat.live-pit .value { color: #1f6e3a !important; }
    .stat .sub { color: #777 !important; }

    /* Intake bars */
    .intake { padding: 12pt 16pt 14pt; border-bottom: 1px solid #ddd !important; }
    .intake-title { color: #555 !important; }
    .intake-row .name { color: #111 !important; }
    .intake-row .num { color: #111 !important; }
    .intake-row .target { color: #555 !important; }
    .bar-track { background: #ddd !important; }
    .bar-fill.good { background: #1f6e3a !important; }
    .bar-fill.warn { background: #8a6700 !important; }
    .bar-fill.low { background: #a82626 !important; }

    /* Lap pills */
    .laps { padding: 12pt 16pt 14pt; }
    .laps-title { color: #555 !important; }
    .laps-grid { grid-template-columns: repeat(10, 1fr) !important; gap: 4pt; margin-bottom: 12pt; }
    .lap-cell { background: white !important; border: 1px solid #999 !important; }
    .lap-cell .n { color: #555 !important; }
    .lap-cell .t { color: #111 !important; }
    .lap-cell.done { background: #e1f4e7 !important; border-color: #1f6e3a !important; }
    .lap-cell.done .t { color: #1f6e3a !important; }
    .lap-cell.slow { background: #fbf3d4 !important; border-color: #8a6700 !important; }
    .lap-cell.slow .t { color: #8a6700 !important; }
    .lap-cell.danger { background: #fadbdb !important; border-color: #a82626 !important; }
    .lap-cell.danger .t { color: #a82626 !important; }
    .lap-cell.current { background: #fce6da !important; border-color: #c44a18 !important; }
    .lap-cell.current .t { color: #c44a18 !important; }

    /* Lap log — force expanded, show every row */
    .laplog { border-top: 1px solid #ddd !important; }
    .laplog.collapsed tr.lap-old,
    .laplog.collapsed tr.note-old { display: table-row !important; }
    .laplog-head-title { color: #555 !important; }
    .laplog th { color: #555 !important; border-bottom: 1px solid #999 !important; }
    .laplog td { border-bottom: 1px solid #eee !important; }
    .laplog tr.note-row td { color: #555 !important; }
    .laplog .lap-num { color: #c44a18 !important; }

    /* Race in Numbers — new page, no split */
    .race-stats {
      background: white !important;
      border: 1px solid #999 !important;
      page-break-before: always;
      page-break-inside: avoid;
      margin-top: 0;
    }
    .race-stats::before { display: none; }
    .race-stats h2 { color: #111 !important; font-size: 22pt; }
    .race-stats h2 em { color: #1f6e3a !important; }
    .race-stats .subtitle { color: #555 !important; }
    .race-stats li { color: #333 !important; border-bottom: 1px solid #eee !important; }
    .race-stats li strong { color: #111 !important; }
    .race-stats li em { color: #c44a18 !important; }

    /* Footer */
    footer {
      margin-top: 14pt; padding-top: 10pt;
      border-top: 1px solid #999 !important;
      color: #555 !important;
    }
    .legend, .legend-item, #last-updated { color: #555 !important; }
    .print-trigger { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-meta">
      <span class="pulse"></span>
      <span>Live Race Command</span>
      <span>· 10 × 10mi loops</span>
    </div>
    <h1>One Hundred <em>Miles</em></h1>
  </div>
  <div style="display: flex; align-items: center; gap: 18px;">
    <div class="race-clock">
      <span class="label">Race Time Elapsed</span>
      <span class="time" id="elapsed">--:--:--</span>
    </div>
    <a class="map-link" href="map.html">Course Map →</a>
    <a class="map-link" href="charts.html">Charts →</a>
  </div>
</header>

<div id="cutoffs" class="cutoffs"></div>
<div id="error" style="display:none;"></div>
<section id="runners" class="runners"></section>

<section id="race-stats" class="race-stats" hidden></section>

<div class="print-trigger">
  <button id="print-btn" type="button">Print Race Report</button>
</div>

<footer>
  <div class="legend">
    <span class="legend-item"><span class="swatch" style="background: var(--green);"></span>On pace</span>
    <span class="legend-item"><span class="swatch" style="background: var(--yellow);"></span>Tight</span>
    <span class="legend-item"><span class="swatch" style="background: var(--red);"></span>Off pace</span>
    <span class="legend-item"><span class="swatch" style="background: var(--accent);"></span>Current lap</span>
  </div>
  <div id="last-updated">—</div>
</footer>

<script>
  const REFRESH_MS = 15000;
  let raceData = null;
  let lastFetchAt = null;

  function fmtDuration(seconds) {
    if (seconds == null || isNaN(seconds) || seconds < 0) return '—';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function fmtPace(secondsPerMile) {
    if (secondsPerMile == null || isNaN(secondsPerMile)) return '—';
    const m = Math.floor(secondsPerMile / 60);
    const s = Math.floor(secondsPerMile % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function fmtClockTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function computeRunner(runner, race) {
    const laps = runner.laps || [];
    const now = new Date();

    const lapDurations = [];
    const pitDurations = [];
    for (let i = 0; i < laps.length; i++) {
      const l = laps[i];
      if (l.startTime && l.endTime) {
        lapDurations.push((new Date(l.endTime) - new Date(l.startTime)) / 1000);
      }
      const next = laps[i + 1];
      if (l.endTime && next && next.startTime) {
        pitDurations.push((new Date(next.startTime) - new Date(l.endTime)) / 1000);
      }
    }

    const inProgressLap = laps.find(l => l.startTime && !l.endTime);
    const currentLapSeconds = inProgressLap
      ? Math.max(0, (now - new Date(inProgressLap.startTime)) / 1000)
      : 0;
    const lastCompleted = [...laps].reverse().find(l => l.startTime && l.endTime);
    const nextStarted = lastCompleted
      ? laps.some(l => l.startTime && new Date(l.startTime) > new Date(lastCompleted.endTime))
      : false;
    const inPit = !!lastCompleted && !nextStarted && lapDurations.length < race.totalLoops;
    const currentPitSeconds = inPit
      ? Math.max(0, (now - new Date(lastCompleted.endTime)) / 1000)
      : 0;

    const completedCourseSeconds = lapDurations.reduce((a, b) => a + b, 0);
    const completedPitSeconds = pitDurations.reduce((a, b) => a + b, 0);
    const completedRaceSeconds = completedCourseSeconds + completedPitSeconds;
    const totalCourseSeconds = completedCourseSeconds + currentLapSeconds;
    const totalPitSeconds = completedPitSeconds + currentPitSeconds;
    const raceSeconds = totalCourseSeconds + totalPitSeconds;

    const lapHours = lapDurations.reduce((a, b) => a + b, 0) / 3600;
    const avgLap = lapDurations.length ? lapDurations.reduce((a, b) => a + b, 0) / lapDurations.length : null;
    const lastLap = lapDurations.length ? lapDurations[lapDurations.length - 1] : null;
    const avgPit = pitDurations.length ? pitDurations.reduce((a, b) => a + b, 0) / pitDurations.length : null;
    const lastPit = pitDurations.length ? pitDurations[pitDurations.length - 1] : null;
    const paceSecPerMile = avgLap ? avgLap / race.loopDistance : null;

    const completedEntries = laps.filter(l => l.startTime && l.endTime);
    const totalCal = completedEntries.reduce((a, l) => a + (l.calories || 0), 0);
    const totalFluid = completedEntries.reduce((a, l) => a + (l.fluidOz || 0), 0);
    const totalSodium = completedEntries.reduce((a, l) => a + (l.sodiumMg || 0), 0);
    const calPerHr = lapHours > 0 ? totalCal / lapHours : 0;
    const fluidPerHr = lapHours > 0 ? totalFluid / lapHours : 0;
    const sodiumPerHr = lapHours > 0 ? totalSodium / lapHours : 0;

    let status = 'notstarted';
    if (lapDurations.length > 0 && avgLap) {
      const avgPitForProjection = avgPit != null ? avgPit : 0;
      const projected = (avgLap + avgPitForProjection) * race.totalLoops;
      const cutoffSec = race.totalCutoffHours * 3600;
      // "Tight" = projected finish within 2.5% of the cutoff (~57min at a 38h cutoff).
      // The 35h last-lap-start gate is still shown in the cutoffs bar but isn't what
      // drives the lap-color status anymore — overall buffer to the final cutoff does.
      const tightThreshold = cutoffSec * (1 - 0.025);
      if (projected > cutoffSec) status = 'offpace';
      else if (projected > tightThreshold) status = 'tight';
      else status = 'onpace';
    } else if (inProgressLap) {
      status = 'onpace';
    }

    const projectedFinish = avgLap ? (avgLap + (avgPit || 0)) * race.totalLoops : null;

    let liveSince = null, liveLapNumber = null;
    if (inProgressLap) {
      liveSince = inProgressLap.startTime;
      liveLapNumber = inProgressLap.lap;
    } else if (inPit && lastCompleted) {
      liveSince = lastCompleted.endTime;
      liveLapNumber = lastCompleted.lap;
    }

    return {
      lapsDone: lapDurations.length,
      milesDone: lapDurations.length * race.loopDistance,
      raceSeconds, totalCourseSeconds, totalPitSeconds,
      completedRaceSeconds, completedCourseSeconds, completedPitSeconds,
      currentLapSeconds, currentPitSeconds,
      avgLap, lastLap, avgPit, lastPit, paceSecPerMile,
      totalCal, totalFluid, totalSodium,
      calPerHr, fluidPerHr, sodiumPerHr,
      status, projectedFinish,
      lapDurations, pitDurations,
      inPit, inProgressLap: !!inProgressLap,
      liveSince, liveLapNumber
    };
  }

  function lapClass(durationSec, runnerStatus) {
    if (durationSec == null) return '';
    // Lap colors mirror the runner's overall projected status. A slow lap only
    // earns a yellow/red badge if the projection actually shows tight/off-pace.
    if (runnerStatus === 'onpace') return 'done';
    if (durationSec < 3.83 * 3600) return 'done';   // < 3:50 — fine given banked buffer
    if (durationSec < 4.17 * 3600) return 'slow';   // 3:50 - 4:10 — eating into buffer
    return 'danger';                                // > 4:10 — over with no margin
  }

  function intakeClass(actual, target) {
    if (target === 0) return 'good';
    const ratio = actual / target;
    if (ratio >= 0.85) return 'good';
    if (ratio >= 0.65) return 'warn';
    return 'low';
  }

  function statusLabel(s) {
    return { onpace: 'On Pace', tight: 'Tight', offpace: 'Off Pace', notstarted: 'Not Started' }[s];
  }

  function renderCutoffs(race) {
    const start = new Date(race.startTime);
    const tight = new Date(start.getTime() + race.lastLapStartCutoffHours * 3600 * 1000);
    const final = new Date(start.getTime() + race.totalCutoffHours * 3600 * 1000);
    const fmt = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) +
      (d.toDateString() !== start.toDateString() ? ' D2' : '');
    document.getElementById('cutoffs').innerHTML = `
      <span class="cutoffs-label">Cutoffs</span>
      <div></div>
      <div class="cutoff-item"><span class="v">${fmt(start)}</span><span class="l">Start</span></div>
      <div class="cutoff-item warn"><span class="v">${fmt(tight)}</span><span class="l">Last lap start · ${race.lastLapStartCutoffHours}h</span></div>
      <div class="cutoff-item danger"><span class="v">${fmt(final)}</span><span class="l">Final · ${race.totalCutoffHours}h</span></div>
    `;
  }

  function renderRunner(runner, race) {
    const c = computeRunner(runner, race);
    const t = race.targets;

    const lapCells = Array.from({ length: race.totalLoops }, (_, i) => {
      const idx = i;
      const dur = c.lapDurations[idx];
      const isCurrent = idx === c.lapsDone && c.status !== 'notstarted' && c.lapsDone < race.totalLoops;
      let cls = '';
      if (dur != null) cls = lapClass(dur, c.status);
      if (isCurrent) cls = 'current';
      const text = dur != null
        ? fmtDuration(dur).replace(/^00:/, '')
        : (isCurrent ? '···' : '—');
      return `<div class="lap-cell ${cls}"><span class="n">L${idx + 1}</span><span class="t">${text}</span></div>`;
    }).join('');

    const lapRows = runner.laps.length === 0
      ? `<tr class="empty"><td colspan="7" style="text-align:center; padding: 24px;">Awaiting first lap</td></tr>`
      : runner.laps.map((l, i) => {
          const dur = (l.startTime && l.endTime)
            ? (new Date(l.endTime) - new Date(l.startTime)) / 1000 : null;
          const next = runner.laps[i + 1];
          let pitSec = null;
          if (l.endTime && next && next.startTime) {
            pitSec = (new Date(next.startTime) - new Date(l.endTime)) / 1000;
          } else if (l.endTime && !next && c.inPit && i === runner.laps.length - 1) {
            pitSec = c.currentPitSeconds;
          }
          const pitCell = pitSec != null
            ? fmtDuration(pitSec).replace(/^00:/, '') + (next ? '' : ' <span style="color: var(--accent); font-size: 9px;">●</span>')
            : '—';
          const noteParts = [l.gearChanges, l.meds, l.issues, l.notes].filter(Boolean);
          const isOld = (runner.laps.length - 1 - i) >= 2;
          const oldCls = isOld ? ' lap-old' : '';
          const noteOldCls = isOld ? ' note-old' : '';
          const noteRow = noteParts.length
            ? `<tr class="note-row${noteOldCls}"><td colspan="7">${noteParts.join(' · ')}</td></tr>`
            : '';
          return `
            <tr class="lap-row${oldCls}">
              <td class="lap-num">${l.lap}</td>
              <td class="num">${fmtClockTime(l.endTime)}</td>
              <td class="num">${dur ? fmtDuration(dur).replace(/^00:/, '') : '—'}</td>
              <td class="num">${pitCell}</td>
              <td class="num">${l.calories || 0}</td>
              <td class="num">${l.fluidOz || 0}oz</td>
              <td class="num">${l.sodiumMg || 0}</td>
            </tr>
            ${noteRow}
          `;
        }).join('');

    return `
      <article class="runner">
        <div class="runner-head">
          <div>
            <div class="runner-name">${runner.name}</div>
            <div class="runner-bib">Bib · ${runner.bib}</div>
          </div>
          <span class="status-badge status-${c.status}">${statusLabel(c.status)}</span>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">Laps</span>
            <span class="value">${c.lapsDone}<span style="color: var(--text-muted); font-size: 14px;">/${race.totalLoops}</span></span>
            <span class="sub">${c.milesDone} mi done</span>
          </div>
          <div class="stat">
            <span class="label">Race Time</span>
            <span class="value live-timer" data-base="${c.completedRaceSeconds}" data-since="${c.liveSince || ''}">${fmtDuration(c.raceSeconds)}</span>
            <span class="sub">of ${race.totalCutoffHours}:00:00</span>
          </div>
          <div class="stat${c.inProgressLap ? ' live' : ''}">
            <span class="label">Course Total</span>
            <span class="value live-timer" data-base="${c.completedCourseSeconds}" data-since="${c.inProgressLap ? (c.liveSince || '') : ''}">${fmtDuration(c.totalCourseSeconds)}</span>
            <span class="sub">${c.inProgressLap ? 'on course' : 'running total'}</span>
          </div>
          <div class="stat${c.inPit ? ' live' : ''}">
            <span class="label">Pit Total</span>
            <span class="value live-timer" data-base="${c.completedPitSeconds}" data-since="${c.inPit ? (c.liveSince || '') : ''}">${fmtDuration(c.totalPitSeconds)}</span>
            <span class="sub">${c.inPit ? 'in pit now' : (c.avgPit != null ? 'avg ' + fmtDuration(c.avgPit) : 'no pit yet')}</span>
          </div>
          ${(() => {
            let liveCls = '', liveValue = '—', liveSub;
            if (c.inProgressLap) {
              liveCls = ' live-course';
              liveValue = fmtDuration(c.currentLapSeconds);
              liveSub = `Lap ${c.liveLapNumber} on course`;
            } else if (c.inPit) {
              liveCls = ' live-pit';
              liveValue = fmtDuration(c.currentPitSeconds);
              liveSub = `In pit · after lap ${c.liveLapNumber}`;
            } else if (c.lapsDone >= race.totalLoops && c.lapsDone > 0) {
              liveSub = 'finished';
            } else {
              liveSub = c.lapsDone === 0 ? 'not started' : 'idle';
            }
            return `
              <div class="stat${liveCls}">
                <span class="label">Live</span>
                <span class="value live-timer" data-base="0" data-since="${c.liveSince || ''}">${liveValue}</span>
                <span class="sub">${liveSub}</span>
              </div>`;
          })()}
          <div class="stat">
            <span class="label">Pace</span>
            <span class="value">${fmtPace(c.paceSecPerMile)}</span>
            <span class="sub">min/mi</span>
          </div>
          <div class="stat">
            <span class="label">Avg Lap</span>
            <span class="value">${fmtDuration(c.avgLap)}</span>
            <span class="sub">last: ${fmtDuration(c.lastLap)}</span>
          </div>
          <div class="stat">
            <span class="label">Avg Pit</span>
            <span class="value">${fmtDuration(c.avgPit)}</span>
            <span class="sub">last: ${fmtDuration(c.lastPit)}</span>
          </div>
        </div>

        <div class="intake">
          <div class="intake-title">Intake / Hour</div>
          <div class="intake-row">
            <span class="name">Calories</span>
            <div class="bar-track"><div class="bar-fill ${intakeClass(c.calPerHr, t.caloriesPerHour)}" style="width: ${Math.min(100, (c.calPerHr / t.caloriesPerHour) * 100)}%"></div></div>
            <span class="num">${Math.round(c.calPerHr)}</span>
            <span class="target">/ ${t.caloriesPerHour}</span>
          </div>
          <div class="intake-row">
            <span class="name">Fluid</span>
            <div class="bar-track"><div class="bar-fill ${intakeClass(c.fluidPerHr, t.fluidOzPerHour)}" style="width: ${Math.min(100, (c.fluidPerHr / t.fluidOzPerHour) * 100)}%"></div></div>
            <span class="num">${c.fluidPerHr.toFixed(1)} oz</span>
            <span class="target">/ ${t.fluidOzPerHour} oz</span>
          </div>
          <div class="intake-row">
            <span class="name">Sodium</span>
            <div class="bar-track"><div class="bar-fill ${intakeClass(c.sodiumPerHr, t.sodiumMgPerHour)}" style="width: ${Math.min(100, (c.sodiumPerHr / t.sodiumMgPerHour) * 100)}%"></div></div>
            <span class="num">${Math.round(c.sodiumPerHr)} mg</span>
            <span class="target">/ ${t.sodiumMgPerHour} mg</span>
          </div>
        </div>

        <div class="laps">
          <div class="laps-head">
            <span class="laps-title">Lap Status</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted);">
              ${c.lapsDone} done · ${race.totalLoops - c.lapsDone} to go
            </span>
          </div>
          <div class="laps-grid">${lapCells}</div>
          <div class="laplog ${laplogCollapsed(runner.id, (runner.laps || []).length) ? 'collapsed' : ''}" data-runner="${runner.id}">
            ${(runner.laps || []).length > 2 ? `
              <div class="laplog-head" data-action="toggle-laplog" data-runner="${runner.id}">
                <span class="laplog-head-title">Lap Log</span>
                <span class="laplog-head-toggle">
                  <span class="when-collapsed">Show all ${runner.laps.length}</span>
                  <span class="when-expanded">Show recent 2</span>
                </span>
              </div>
            ` : ''}
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Done</th><th class="num">Lap</th><th class="num">Pit</th>
                  <th class="num">Cal</th><th class="num">Fluid</th><th class="num">Na</th>
                </tr>
              </thead>
              <tbody>${lapRows}</tbody>
            </table>
          </div>
        </div>
      </article>
    `;
  }

  function tick() {
    if (!raceData) return;
    const now = new Date();
    const start = new Date(raceData.race.startTime);
    const cutoffSec = (raceData.race.totalCutoffHours || 38) * 3600;
    let diff = Math.floor((now - start) / 1000);
    const el = document.getElementById('elapsed');
    if (diff < 0) {
      const until = -diff;
      el.textContent = `-${fmtDuration(until)}`;
      el.style.color = 'var(--text-muted)';
    } else {
      const capped = Math.min(diff, cutoffSec);
      el.textContent = fmtDuration(capped);
      el.style.color = capped >= cutoffSec ? 'var(--red)' : 'var(--text)';
    }
    document.querySelectorAll('.live-timer').forEach(t => {
      const since = t.dataset.since;
      if (!since) return;
      const base = parseFloat(t.dataset.base) || 0;
      const seconds = base + Math.max(0, (Date.now() - new Date(since).getTime()) / 1000);
      t.textContent = fmtDuration(seconds);
    });
  }

  async function load() {
    try {
      const res = await fetch('data.json?_=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
      });
      if (!res.ok) throw new Error('Failed to load data.json');
      raceData = await res.json();
      lastFetchAt = new Date();
      renderCutoffs(raceData.race);
      document.getElementById('runners').innerHTML =
        raceData.runners.map(r => renderRunner(r, raceData.race)).join('');
      renderRaceStats(raceData.race);
      document.getElementById('error').style.display = 'none';
      updateLastUpdatedLabel();
      tick();
    } catch (err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').className = 'error-banner';
      document.getElementById('error').textContent = `Error loading race data: ${err.message}`;
    }
  }

  function updateLastUpdatedLabel() {
    if (!raceData) return;
    const lu = raceData.lastUpdated
      ? `Data updated ${new Date(raceData.lastUpdated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
      : 'Awaiting start';
    let live = '';
    if (lastFetchAt) {
      const ago = Math.max(0, Math.floor((Date.now() - lastFetchAt.getTime()) / 1000));
      live = ago < 5 ? ' · live' : ` · checked ${ago}s ago`;
    }
    document.getElementById('last-updated').textContent = lu + live;
  }

  function renderRaceStats(race) {
    const el = document.getElementById('race-stats');
    if (!raceData || !raceData.runners || raceData.runners.length === 0) { el.hidden = true; return; }
    const allFinished = raceData.runners.every(r => {
      const done = (r.laps || []).filter(l => l.startTime && l.endTime).length;
      return done >= race.totalLoops;
    });
    if (!allFinished) { el.hidden = true; return; }
    el.hidden = false;

    const stats = raceData.runners.map(r => {
      const completed = (r.laps || []).filter(l => l.startTime && l.endTime);
      const allLaps = r.laps || [];
      const cal = completed.reduce((a, l) => a + (l.calories || 0), 0);
      const fluidOz = completed.reduce((a, l) => a + (l.fluidOz || 0), 0);
      const sodium = completed.reduce((a, l) => a + (l.sodiumMg || 0), 0);
      const start = new Date(allLaps[0].startTime);
      const end = new Date(completed[completed.length - 1].endTime);
      const totalSec = (end - start) / 1000;
      const courseSec = completed.reduce((a, l) =>
        a + (new Date(l.endTime) - new Date(l.startTime)) / 1000, 0);
      const pitSec = totalSec - courseSec;
      let tailwindMl = 0;
      for (const l of completed) {
        const text = l.notes || '';
        for (const m of text.matchAll(/(\d+(?:\.\d+)?)\s*mL\s+Tailwind/gi)) {
          tailwindMl += parseFloat(m[1]);
        }
        for (const m of text.matchAll(/(\d+(?:\.\d+)?)\s*(?:x|×)?\s*flasks?\s+Tailwind/gi)) {
          tailwindMl += parseFloat(m[1]) * 500;
        }
        for (const m of text.matchAll(/(\d+(?:\.\d+)?)\s*(?:x|×)?\s*Tailwind\s+flasks?/gi)) {
          tailwindMl += parseFloat(m[1]) * 500;
        }
        for (const m of text.matchAll(/(\d+(?:\.\d+)?)\s*(?:x|×)?\s*flasks?\s*\+\s*\d+\s*mL\s+Tailwind/gi)) {
          tailwindMl += parseFloat(m[1]) * 500;
        }
      }
      const tailwindScoops = tailwindMl / 500;
      const tailwindCal = tailwindScoops * 200;
      const tailwindNa = tailwindScoops * 620;
      return { runner: r, cal, fluidOz, sodium, totalSec, courseSec, pitSec,
               tailwindScoops, tailwindMl, tailwindCal, tailwindNa };
    });

    const tw = stats.reduce((a, b) => b.tailwindScoops > a.tailwindScoops ? b : a, stats[0]);

    const fmtH = sec => {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return `${h}h ${m}m`;
    };
    const ozToL = oz => (oz * 0.0295735).toFixed(1);
    const ozToGal = oz => (oz / 128).toFixed(1);

    const calLines = stats.map(s =>
      `<strong>${s.cal.toLocaleString()}</strong> cal (${s.runner.name})`
    ).join(' / ');
    const fluidLines = stats.map(s =>
      `<strong>${ozToL(s.fluidOz)} L</strong> (${s.runner.name})`
    ).join(' / ');
    const sodiumLines = stats.map(s =>
      `<strong>${(s.sodium/1000).toFixed(1)} g</strong> (${s.runner.name})`
    ).join(' / ');

    const totalSec = stats[0].totalSec;
    const courseSec = stats[0].courseSec;
    const pitSec = stats[0].pitSec;

    el.innerHTML = `
      <div class="subtitle">Finished · 100 miles · both runners</div>
      <h2>The Race · in <em>Numbers</em></h2>
      <ul>
        <li>${calLines} — more than <strong>4× a normal day's intake</strong>. Estimated burn ~12,000-13,000 cal each, so a 3-4k cal deficit per runner. Par for an ultra.</li>
        <li>${fluidLines} of fluid consumed. That's a <strong>~${ozToGal(Math.max(...stats.map(s=>s.fluidOz)))}-gallon</strong> water jug for the higher-volume runner.</li>
        <li>${sodiumLines} cumulative sodium. Daily adult recommendation is ~1.5 g — they each hit <strong>5-7×</strong> that on their own.</li>
        <li><strong>${fmtH(totalSec)}</strong> total race time — <strong>${fmtH(courseSec)}</strong> on course, <strong>${fmtH(pitSec)}</strong> in pit. Lap 10 was the slowest at <strong>~3:53</strong> for both, but they crossed within <strong>1 second</strong> of each other.</li>
        <li><strong>${tw.runner.name}</strong> ran on a Tailwind drip: <strong>~${tw.tailwindScoops.toFixed(1)} scoops</strong>, ~${(tw.tailwindMl/1000).toFixed(1)} L of mixed drink, ~${tw.tailwindCal.toLocaleString()} cal (<strong>${Math.round(tw.tailwindCal/tw.cal*100)}%</strong> of total cal), ~${(tw.tailwindNa/1000).toFixed(1)} g sodium (<strong>${Math.round(tw.tailwindNa/tw.sodium*100)}%</strong> of total sodium).</li>
        <li>Cumulative ibuprofen: Jasmine ~14-15 doses, Oppenheimer ~16-17 (with one Tylenol detour at pit 8). Hydration stayed strong throughout — the urine-color check held.</li>
      </ul>
    `;
  }

  const LAPLOG_KEY = 'dashboard-laplog-collapsed-v1';
  function loadLaplogState() {
    try { return JSON.parse(localStorage.getItem(LAPLOG_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function saveLaplogState(s) {
    try { localStorage.setItem(LAPLOG_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function laplogCollapsed(runnerId, lapCount) {
    if (lapCount <= 2) return false;
    const s = loadLaplogState();
    return s[runnerId] !== false;
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action="toggle-laplog"]');
    if (!t) return;
    const id = t.dataset.runner;
    const log = t.closest('.laplog');
    if (!log) return;
    const nowCollapsed = !log.classList.contains('collapsed');
    log.classList.toggle('collapsed', nowCollapsed);
    const s = loadLaplogState();
    s[id] = nowCollapsed;
    saveLaplogState(s);
  });

  document.getElementById('print-btn').addEventListener('click', () => {
    window.open('print-report.html', '_blank');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') load();
  });

  load();
  setInterval(tick, 1000);
  setInterval(updateLastUpdatedLabel, 1000);
  setInterval(load, REFRESH_MS);
</script>

</body>
</html>
