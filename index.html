<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sangre de Cristo 100 · Race Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --bg-elevated: #14161b;
    --bg-card: #1a1d24;
    --border: #262932;
    --border-bright: #353946;
    --text: #e8e6e1;
    --text-dim: #8a8a8a;
    --text-muted: #5a5a60;
    --accent: #ff6b3d;
    --accent-glow: rgba(255, 107, 61, 0.18);
    --green: #6ee7a8;
    --yellow: #f5c451;
    --red: #ff5959;
    --blue: #5ec8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255, 107, 61, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(94, 200, 255, 0.05) 0%, transparent 40%);
    background-attachment: fixed;
    padding: 32px 40px 80px;
  }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px; margin-bottom: 32px;
    flex-wrap: wrap; gap: 24px;
  }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand-meta {
    display: flex; gap: 14px; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--text-muted);
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 800;
    font-size: 44px; line-height: 1; letter-spacing: -0.025em;
  }
  h1 em { font-style: italic; color: var(--accent); font-weight: 600; }
  a.map-link {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px;
  }
  a.map-link:hover { color: var(--accent); border-color: var(--accent); }
  .race-clock { text-align: right; display: flex; flex-direction: column; gap: 4px; }
  .race-clock .label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .race-clock .time {
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;
    color: var(--text); letter-spacing: -0.02em;
  }

  .cutoffs {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 4px; padding: 18px 24px; margin-bottom: 32px;
    display: grid; grid-template-columns: auto 1fr auto auto auto auto;
    gap: 32px; align-items: center;
  }
  .cutoffs-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .cutoff-item { display: flex; flex-direction: column; gap: 2px; }
  .cutoff-item .v { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
  .cutoff-item .l { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .cutoff-item.warn .v { color: var(--yellow); }
  .cutoff-item.danger .v { color: var(--red); }

  .runners { display: grid; grid-template-columns: 1fr; gap: 24px; }

  .runner {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; position: relative;
  }
  .runner::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .runner-head {
    padding: 24px 28px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
  }
  .runner-name {
    font-family: 'Fraunces', serif; font-size: 32px;
    font-weight: 600; letter-spacing: -0.02em;
  }
  .runner-bib {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); letter-spacing: 0.1em;
    text-transform: uppercase; margin-top: 4px;
  }
  .status-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 2px; border: 1px solid currentColor;
  }
  .status-onpace { color: var(--green); }
  .status-tight { color: var(--yellow); }
  .status-offpace { color: var(--red); }
  .status-notstarted { color: var(--text-muted); }
  .status-finished { color: var(--blue); }

  .stats {
    display: grid; grid-template-columns: repeat(8, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 16px 14px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .stat:last-child { border-right: none; }
  .stat.live .value { color: var(--accent); }
  .stat.live-course .value { color: var(--accent); }
  .stat.live-pit .value { color: var(--green); }
  .stat.live-course .label, .stat.live-pit .label {
    animation: liveBlink 2s ease-in-out infinite;
  }
  @keyframes liveBlink {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .stat .label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-muted);
  }
  .stat .value {
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--text);
  }
  .stat .sub { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .intake { padding: 20px 28px 24px; border-bottom: 1px solid var(--border); }
  .intake-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 14px;
  }
  .intake-row {
    display: grid; grid-template-columns: 90px 1fr auto auto;
    gap: 14px; align-items: center; padding: 8px 0;
  }
  .intake-row .name { font-size: 13px; color: var(--text-dim); }
  .bar-track {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; position: relative;
  }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .bar-fill.good { background: var(--green); }
  .bar-fill.warn { background: var(--yellow); }
  .bar-fill.low { background: var(--red); }
  .intake-row .num {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    font-weight: 600; text-align: right; min-width: 90px;
  }
  .intake-row .target {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); min-width: 60px; text-align: right;
  }

  .legs { padding: 20px 28px 28px; }
  .legs-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px;
  }
  .legs-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .legs-grid {
    display: grid; grid-template-columns: repeat(16, 1fr);
    gap: 6px; margin-bottom: 16px;
  }
  .leg-cell {
    aspect-ratio: 1; background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: 3px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: 'JetBrains Mono', monospace; cursor: default;
    padding: 2px;
  }
  .leg-cell .n { font-size: 9px; color: var(--text-muted); margin-bottom: 2px; }
  .leg-cell .t { font-size: 10px; font-weight: 700; }
  .leg-cell.done { background: rgba(110, 231, 168, 0.08); border-color: rgba(110, 231, 168, 0.4); }
  .leg-cell.done .t { color: var(--green); }
  .leg-cell.slow { background: rgba(245, 196, 81, 0.08); border-color: rgba(245, 196, 81, 0.4); }
  .leg-cell.slow .t { color: var(--yellow); }
  .leg-cell.danger { background: rgba(255, 89, 89, 0.08); border-color: rgba(255, 89, 89, 0.4); }
  .leg-cell.danger .t { color: var(--red); }
  .leg-cell.current {
    background: var(--accent-glow); border-color: var(--accent);
    animation: currentPulse 2s ease-in-out infinite;
  }
  .leg-cell.current .t { color: var(--accent); }
  @keyframes currentPulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { box-shadow: 0 0 0 4px transparent; }
  }

  .leglog { border-top: 1px solid var(--border); margin-top: 8px; }
  .leglog-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 2px 6px;
    cursor: pointer; user-select: none;
  }
  .leglog-head:hover .leglog-head-toggle { color: var(--accent); }
  .leglog-head-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; }
  .leglog-head-toggle { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }
  .leglog-head-toggle::before { content: '▼ '; }
  .leglog.collapsed .leglog-head-toggle::before { content: '▶ '; }
  .leglog.collapsed tr.leg-old, .leglog.collapsed tr.note-old { display: none; }
  .leglog.collapsed .when-expanded, .leglog:not(.collapsed) .when-collapsed { display: none; }
  .leglog table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .leglog th {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
    text-align: left; padding: 14px 8px 10px; font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  .leglog th:first-child { padding-left: 0; }
  .leglog th.num, .leglog td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .leglog td { padding: 12px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .leglog td:first-child { padding-left: 0; }
  .leglog tr:last-child td { border-bottom: none; }
  .leglog .leg-num {
    font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600;
    color: var(--accent); width: 30px; vertical-align: top;
  }
  .leglog .leg-route { font-size: 13px; color: var(--text); font-weight: 600; }
  .leglog .leg-route .sep { color: var(--text-muted); margin: 0 6px; }
  .leglog tr.leg-route-row td { border-bottom: none; padding-bottom: 4px; padding-top: 14px; }
  .leglog tr.leg-row td { padding-top: 0; }
  .leglog tr.leg-row:has(+ tr.note-row) td { border-bottom: none; padding-bottom: 6px; }
  .leglog tr.note-row td {
    padding: 0 8px 12px 8px; padding-left: 38px;
    font-size: 11px; color: var(--text-dim); line-height: 1.5;
    border-bottom: 1px solid var(--border);
  }
  .leglog tr.note-row:last-child td { border-bottom: none; }
  .leglog tr.empty td { color: var(--text-muted); font-style: italic; }

  footer {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
  }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }

  .error-banner {
    background: rgba(255, 89, 89, 0.1); border: 1px solid var(--red);
    color: var(--red); padding: 16px; border-radius: 4px; margin-bottom: 24px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }

  .race-stats {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 28px 32px;
    margin-top: 32px; position: relative; overflow: hidden;
  }
  .race-stats[hidden] { display: none; }
  .race-stats::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--green), transparent);
  }
  .race-stats h2 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 30px; letter-spacing: -0.02em; margin-bottom: 4px;
  }
  .race-stats h2 em { font-style: italic; color: var(--green); font-weight: 600; }
  .race-stats .subtitle {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-muted); letter-spacing: 0.18em;
    text-transform: uppercase; margin-bottom: 18px;
  }
  .race-stats ul { list-style: none; padding: 0; margin: 0; }
  .race-stats li {
    padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 14px; line-height: 1.55; color: var(--text-dim);
  }
  .race-stats li:last-child { border-bottom: none; }
  .race-stats li strong { color: var(--text); font-weight: 600; }
  .race-stats li em { color: var(--accent); font-style: normal; font-weight: 600; }

  .print-trigger {
    margin-top: 24px;
    display: flex; justify-content: center;
  }
  .print-trigger button {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600;
    color: var(--text-dim); background: transparent;
    border: 1px solid var(--border-bright);
    padding: 12px 20px; border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .print-trigger button:hover { color: var(--accent); border-color: var(--accent); }
  .print-trigger button:active { transform: scale(0.98); }

  @media (max-width: 1300px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .stat:nth-child(4n) { border-right: none; }
    .stat:nth-last-child(-n+4) { border-bottom: none; }
    .legs-grid { grid-template-columns: repeat(8, 1fr); }
  }
  @media (max-width: 800px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .stat:nth-child(4n) { border-right: 1px solid var(--border); }
    .stat:nth-child(3n) { border-right: none; }
    .stat:nth-last-child(-n+2) { border-bottom: none; }
  }
  @media (max-width: 500px) {
    body { padding: 20px 16px 60px; }
    h1 { font-size: 32px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat { padding: 14px 12px; }
    .stat:nth-child(3n) { border-right: 1px solid var(--border); }
    .stat:nth-child(2n) { border-right: none; }
    .stat:nth-last-child(-n+2) { border-bottom: none; }
    .cutoffs { grid-template-columns: 1fr 1fr; gap: 16px; }
    .legs-grid { grid-template-columns: repeat(4, 1fr); }
    .leglog table { font-size: 11px; }
    .leglog th, .leglog td { padding: 8px 4px; }
  }

  @media print {
    @page { size: letter portrait; margin: 0.5in; }
    *, *::before, *::after {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      animation: none !important;
      transition: none !important;
    }
    html, body {
      background: white !important; background-image: none !important;
      color: #111 !important; font-size: 10.5pt;
    }
    body { padding: 0 !important; }
    a.map-link, .pulse, .leglog-head-toggle { display: none !important; }
    .leglog-head { cursor: default !important; padding: 12px 2px 6px; }
    header { border-bottom: 1px solid #999; padding-bottom: 12pt; margin-bottom: 14pt; }
    h1 { color: #111 !important; font-size: 24pt; }
    h1 em { color: #c44a18 !important; }
    .brand-meta { color: #555 !important; }
    .race-clock .label { color: #555 !important; }
    .race-clock .time { color: #111 !important; font-size: 18pt; }
    .cutoffs {
      background: #f6f6f6 !important; border: 1px solid #bbb !important;
      padding: 12pt 16pt; margin-bottom: 14pt; page-break-inside: avoid;
    }
    .cutoffs-label { color: #555 !important; }
    .cutoff-item .v { color: #111 !important; }
    .cutoff-item .l { color: #555 !important; }
    .cutoff-item.warn .v { color: #8a6700 !important; }
    .cutoff-item.danger .v { color: #a82626 !important; }
    .runners { display: block !important; }
    .runner {
      background: white !important; border: 1px solid #999 !important;
      page-break-inside: avoid; margin-bottom: 16pt;
    }
    .runner::before { display: none; }
    .runner-head { padding: 14pt 16pt 10pt; border-bottom: 1px solid #ddd !important; }
    .runner-name { color: #111 !important; font-size: 22pt; }
    .runner-bib { color: #555 !important; }
    .status-onpace { color: #1f6e3a !important; border-color: #1f6e3a !important; }
    .status-tight { color: #8a6700 !important; border-color: #8a6700 !important; }
    .status-offpace { color: #a82626 !important; border-color: #a82626 !important; }
    .status-notstarted { color: #555 !important; border-color: #555 !important; }
    .status-finished { color: #234a8a !important; border-color: #234a8a !important; }
    .stats { grid-template-columns: repeat(4, 1fr) !important; border-bottom: 1px solid #ddd !important; }
    .stat {
      padding: 10pt 12pt;
      border-right: 1px solid #ddd !important; border-bottom: 1px solid #ddd !important;
    }
    .stat:nth-child(4n) { border-right: none !important; }
    .stat:nth-last-child(-n+4) { border-bottom: none !important; }
    .stat .label { color: #555 !important; }
    .stat .value, .stat.live .value, .stat.live-course .value { color: #111 !important; }
    .stat.live-pit .value { color: #1f6e3a !important; }
    .stat .sub { color: #777 !important; }
    .intake { padding: 12pt 16pt 14pt; border-bottom: 1px solid #ddd !important; }
    .intake-title { color: #555 !important; }
    .intake-row .name { color: #111 !important; }
    .intake-row .num { color: #111 !important; }
    .intake-row .target { color: #555 !important; }
    .bar-track { background: #ddd !important; }
    .bar-fill.good { background: #1f6e3a !important; }
    .bar-fill.warn { background: #8a6700 !important; }
    .bar-fill.low { background: #a82626 !important; }
    .legs { padding: 12pt 16pt 14pt; }
    .legs-title { color: #555 !important; }
    .legs-grid { grid-template-columns: repeat(16, 1fr) !important; gap: 3pt; margin-bottom: 12pt; }
    .leg-cell { background: white !important; border: 1px solid #999 !important; }
    .leg-cell .n { color: #555 !important; }
    .leg-cell .t { color: #111 !important; }
    .leg-cell.done { background: #e1f4e7 !important; border-color: #1f6e3a !important; }
    .leg-cell.done .t { color: #1f6e3a !important; }
    .leg-cell.slow { background: #fbf3d4 !important; border-color: #8a6700 !important; }
    .leg-cell.slow .t { color: #8a6700 !important; }
    .leg-cell.danger { background: #fadbdb !important; border-color: #a82626 !important; }
    .leg-cell.danger .t { color: #a82626 !important; }
    .leg-cell.current { background: #fce6da !important; border-color: #c44a18 !important; }
    .leg-cell.current .t { color: #c44a18 !important; }
    .leglog { border-top: 1px solid #ddd !important; }
    .leglog.collapsed tr.leg-old,
    .leglog.collapsed tr.note-old { display: table-row !important; }
    .leglog-head-title { color: #555 !important; }
    .leglog th { color: #555 !important; border-bottom: 1px solid #999 !important; }
    .leglog td { border-bottom: 1px solid #eee !important; }
    .leglog tr.note-row td { color: #555 !important; }
    .leglog .leg-num { color: #c44a18 !important; }
    .leglog .leg-route { color: #111 !important; }
    .race-stats {
      background: white !important; border: 1px solid #999 !important;
      page-break-before: always; page-break-inside: avoid; margin-top: 0;
    }
    .race-stats::before { display: none; }
    .race-stats h2 { color: #111 !important; font-size: 22pt; }
    .race-stats h2 em { color: #1f6e3a !important; }
    .race-stats .subtitle { color: #555 !important; }
    .race-stats li { color: #333 !important; border-bottom: 1px solid #eee !important; }
    .race-stats li strong { color: #111 !important; }
    .race-stats li em { color: #c44a18 !important; }
    footer {
      margin-top: 14pt; padding-top: 10pt;
      border-top: 1px solid #999 !important; color: #555 !important;
    }
    .legend, .legend-item, #last-updated { color: #555 !important; }
    .print-trigger { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-meta">
      <span class="pulse"></span>
      <span>Live Race Command</span>
      <span id="race-date"></span>
      <span id="course-meta">· 16 legs · 101.3 mi</span>
    </div>
    <h1>Sangre de <em>Cristo</em> 100</h1>
  </div>
  <div style="display: flex; align-items: center; gap: 18px;">
    <div class="race-clock">
      <span class="label">Time of Day</span>
      <span class="time" id="clock-now">--:--:--</span>
    </div>
    <div class="race-clock">
      <span class="label" id="elapsed-label">Race Time Elapsed</span>
      <span class="time" id="elapsed">--:--:--</span>
    </div>
    <a class="map-link" href="map.html">Course Map →</a>
    <a class="map-link" href="charts.html">Charts →</a>
    <a class="map-link" id="pit-link" href="pit.html" hidden>Pit →</a>
  </div>
</header>

<div id="cutoffs" class="cutoffs"></div>
<div id="error" style="display:none;"></div>
<section id="runners" class="runners"></section>

<section id="race-stats" class="race-stats" hidden></section>

<div class="print-trigger">
  <button id="print-btn" type="button">Print Race Report</button>
</div>

<footer>
  <div class="legend">
    <span class="legend-item"><span class="swatch" style="background: var(--green);"></span>On pace</span>
    <span class="legend-item"><span class="swatch" style="background: var(--yellow);"></span>Tight</span>
    <span class="legend-item"><span class="swatch" style="background: var(--red);"></span>Off pace</span>
    <span class="legend-item"><span class="swatch" style="background: var(--accent);"></span>Current leg</span>
  </div>
  <div id="last-updated">—</div>
</footer>

<script>
  const REFRESH_MS = 15000;
  let raceData = null;
  let lastFetchAt = null;

  function fmtDuration(seconds) {
    if (seconds == null || isNaN(seconds) || seconds < 0) return '—';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  function fmtShortDuration(seconds) {
    if (seconds == null || isNaN(seconds) || seconds < 0) return '—';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    if (h) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  function fmtPace(secondsPerMile) {
    if (secondsPerMile == null || isNaN(secondsPerMile)) return '—';
    const m = Math.floor(secondsPerMile / 60);
    const s = Math.floor(secondsPerMile % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }
  function fmtClockTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function fmtClockTimeWithDay(iso, raceStartIso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const start = raceStartIso ? new Date(raceStartIso) : null;
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (!start) return time;
    const startDay = new Date(start); startDay.setHours(0, 0, 0, 0);
    const day = new Date(d); day.setHours(0, 0, 0, 0);
    const dayDiff = Math.round((day - startDay) / 86400000);
    if (dayDiff <= 0) return time;
    if (dayDiff === 1) return time + ' D2';
    return time + ` D${dayDiff + 1}`;
  }

  function segmentVisible(seg, crewLot) {
    if (seg.crewAccess === 'all') return true;
    if (seg.crewAccess === 'none') return false;
    if (crewLot === 'any') return true;
    return seg.crewAccess === crewLot;
  }

  function buildCourseIndex(race) {
    let cum = 0;
    return race.segments.map(s => {
      cum += s.distance;
      return { ...s, cumMile: +cum.toFixed(2) };
    });
  }

  function computeRunner(runner, race, course) {
    const legs = runner.legs || [];
    const now = new Date();
    const totalLegs = race.segments.length;

    const legDurations = [];
    const pitDurations = [];
    const completedDistance = [];
    for (let i = 0; i < legs.length; i++) {
      const l = legs[i];
      const seg = course[l.leg - 1];
      if (l.startTime && l.endTime) {
        legDurations.push((new Date(l.endTime) - new Date(l.startTime)) / 1000);
        completedDistance.push(seg ? seg.distance : 0);
      }
      const next = legs[i + 1];
      if (l.endTime && next && next.startTime) {
        pitDurations.push((new Date(next.startTime) - new Date(l.endTime)) / 1000);
      }
    }

    const inProgressLeg = legs.find(l => l.startTime && !l.endTime);
    const currentLegSeconds = inProgressLeg
      ? Math.max(0, (now - new Date(inProgressLeg.startTime)) / 1000)
      : 0;
    const lastCompleted = [...legs].reverse().find(l => l.startTime && l.endTime);
    const nextStarted = lastCompleted
      ? legs.some(l => l.startTime && new Date(l.startTime) > new Date(lastCompleted.endTime))
      : false;
    const legsDone = legDurations.length;
    const finished = legsDone >= totalLegs;
    const inPit = !!lastCompleted && !nextStarted && !finished;
    const currentPitSeconds = inPit
      ? Math.max(0, (now - new Date(lastCompleted.endTime)) / 1000)
      : 0;

    const completedCourseSeconds = legDurations.reduce((a, b) => a + b, 0);
    const completedPitSeconds = pitDurations.reduce((a, b) => a + b, 0);
    const completedRaceSeconds = completedCourseSeconds + completedPitSeconds;
    const totalCourseSeconds = completedCourseSeconds + currentLegSeconds;
    const totalPitSeconds = completedPitSeconds + currentPitSeconds;
    const raceSeconds = totalCourseSeconds + totalPitSeconds;

    const milesDone = completedDistance.reduce((a, b) => a + b, 0);
    const milesTotal = race.totalDistance;
    const avgPaceSecPerMile = milesDone > 0 ? completedCourseSeconds / milesDone : null;

    let lastLegPace = null, lastLegSec = null, lastLegDistance = null;
    if (legDurations.length > 0) {
      lastLegSec = legDurations[legDurations.length - 1];
      lastLegDistance = completedDistance[completedDistance.length - 1];
      lastLegPace = lastLegDistance > 0 ? lastLegSec / lastLegDistance : null;
    }
    const avgPit = pitDurations.length ? pitDurations.reduce((a, b) => a + b, 0) / pitDurations.length : null;
    const lastPit = pitDurations.length ? pitDurations[pitDurations.length - 1] : null;

    const completedEntries = legs.filter(l => l.startTime && l.endTime);
    const totalCal = completedEntries.reduce((a, l) => a + (l.calories || 0), 0);
    const totalFluid = completedEntries.reduce((a, l) => a + (l.fluidOz || 0), 0);
    const totalSodium = completedEntries.reduce((a, l) => a + (l.sodiumMg || 0), 0);
    const courseHours = completedCourseSeconds / 3600;
    const calPerHr = courseHours > 0 ? totalCal / courseHours : 0;
    const fluidPerHr = courseHours > 0 ? totalFluid / courseHours : 0;
    const sodiumPerHr = courseHours > 0 ? totalSodium / courseHours : 0;

    const cutoffSec = race.totalCutoffHours * 3600;
    let projectedFinishSec = null;
    if (avgPaceSecPerMile != null) {
      const milesLeft = Math.max(0, milesTotal - milesDone);
      const stopsLeft = Math.max(0, totalLegs - legsDone - 1);
      const pitForProjection = avgPit != null ? avgPit : 0;
      projectedFinishSec = completedRaceSeconds + milesLeft * avgPaceSecPerMile + stopsLeft * pitForProjection;
    }

    let status = 'notstarted';
    if (finished) {
      status = 'finished';
    } else if (avgPaceSecPerMile != null) {
      const tightThreshold = cutoffSec * (1 - 0.025);
      if (projectedFinishSec > cutoffSec) status = 'offpace';
      else if (projectedFinishSec > tightThreshold) status = 'tight';
      else status = 'onpace';
    } else if (inProgressLeg) {
      status = 'onpace';
    }

    const start = new Date(race.startTime);
    let nextCutoff = null;
    for (const seg of course) {
      if (seg.cutoffHoursFromStart == null) continue;
      if (seg.cumMile <= milesDone + 0.0001) continue;
      nextCutoff = {
        seg, atIso: new Date(start.getTime() + seg.cutoffHoursFromStart * 3600 * 1000).toISOString()
      };
      break;
    }

    let liveSince = null, liveLegNumber = null;
    if (inProgressLeg) {
      liveSince = inProgressLeg.startTime;
      liveLegNumber = inProgressLeg.leg;
    } else if (inPit && lastCompleted) {
      liveSince = lastCompleted.endTime;
      liveLegNumber = lastCompleted.leg;
    }

    return {
      legsDone, milesDone, milesTotal,
      raceSeconds, totalCourseSeconds, totalPitSeconds,
      completedRaceSeconds, completedCourseSeconds, completedPitSeconds,
      currentLegSeconds, currentPitSeconds,
      avgPaceSecPerMile, lastLegPace, lastLegSec, lastLegDistance,
      avgPit, lastPit,
      totalCal, totalFluid, totalSodium, calPerHr, fluidPerHr, sodiumPerHr,
      status, projectedFinishSec, nextCutoff,
      legDurations, completedDistance, pitDurations,
      inPit, inProgressLeg: !!inProgressLeg, finished,
      liveSince, liveLegNumber
    };
  }

  function legClass(durationSec, distanceMi, runnerStatus, cutoffPaceSecPerMile) {
    if (durationSec == null || distanceMi == null || distanceMi <= 0) return '';
    if (runnerStatus === 'onpace' || runnerStatus === 'finished') return 'done';
    const pace = durationSec / distanceMi;
    if (pace < cutoffPaceSecPerMile * 0.95) return 'done';
    if (pace < cutoffPaceSecPerMile) return 'slow';
    return 'danger';
  }

  function intakeClass(actual, target) {
    if (target === 0) return 'good';
    const ratio = actual / target;
    if (ratio >= 0.85) return 'good';
    if (ratio >= 0.65) return 'warn';
    return 'low';
  }

  function statusLabel(s) {
    return {
      onpace: 'On Pace', tight: 'Tight', offpace: 'Off Pace',
      notstarted: 'Not Started', finished: 'Finished'
    }[s];
  }

  function renderCutoffs(race, course, runnerComputed) {
    const start = new Date(race.startTime);
    const final = new Date(start.getTime() + race.totalCutoffHours * 3600 * 1000);
    const next = runnerComputed && runnerComputed.nextCutoff;
    const startTxt = fmtClockTimeWithDay(start.toISOString(), race.startTime);
    const finalTxt = fmtClockTimeWithDay(final.toISOString(), race.startTime);
    const nextHtml = next
      ? `<div class="cutoff-item warn">
           <span class="v">${fmtClockTimeWithDay(next.atIso, race.startTime)}</span>
           <span class="l">${next.seg.to} · M${next.seg.cumMile} · ${next.seg.cutoffHoursFromStart}h</span>
         </div>`
      : `<div class="cutoff-item"><span class="v">—</span><span class="l">No upcoming cutoff</span></div>`;
    const countdownHtml = next
      ? `<div class="cutoff-item" id="next-cutoff-countdown" data-target="${next.atIso}">
           <span class="v">—</span><span class="l">Until next cutoff</span>
         </div>`
      : `<div class="cutoff-item"><span class="v">—</span><span class="l">Until next cutoff</span></div>`;
    document.getElementById('cutoffs').innerHTML = `
      <span class="cutoffs-label">Cutoffs</span>
      <div></div>
      <div class="cutoff-item"><span class="v">${startTxt}</span><span class="l">Start</span></div>
      ${nextHtml}
      ${countdownHtml}
      <div class="cutoff-item danger"><span class="v">${finalTxt}</span><span class="l">Final · ${race.totalCutoffHours}h</span></div>
    `;
  }

  function renderRunner(runner, race, course) {
    const c = computeRunner(runner, race, course);
    const t = race.targets;
    const totalLegs = course.length;
    const cutoffPaceSecPerMile = (race.totalCutoffHours * 3600) / race.totalDistance;

    const legCells = course.map((seg, i) => {
      const legEntry = (runner.legs || []).find(l => l.leg === seg.leg);
      const dur = (legEntry && legEntry.startTime && legEntry.endTime)
        ? (new Date(legEntry.endTime) - new Date(legEntry.startTime)) / 1000 : null;
      const isCurrent = i === c.legsDone && c.status !== 'notstarted' && !c.finished;
      let cls = '';
      if (dur != null) cls = legClass(dur, seg.distance, c.status, cutoffPaceSecPerMile);
      if (isCurrent) cls = 'current';
      const text = dur != null
        ? fmtShortDuration(dur)
        : (isCurrent ? '···' : '—');
      return `<div class="leg-cell ${cls}" title="L${seg.leg}: ${seg.from} → ${seg.to} (${seg.distance} mi)"><span class="n">L${seg.leg}</span><span class="t">${text}</span></div>`;
    }).join('');

    const legRows = (runner.legs || []).length === 0
      ? `<tr class="empty"><td colspan="8" style="text-align:center; padding: 24px;">Awaiting first leg</td></tr>`
      : (runner.legs || []).map((l, i) => {
          const seg = course[l.leg - 1];
          const dur = (l.startTime && l.endTime)
            ? (new Date(l.endTime) - new Date(l.startTime)) / 1000 : null;
          const pace = (dur != null && seg && seg.distance > 0) ? dur / seg.distance : null;
          const next = (runner.legs || [])[i + 1];
          let pitSec = null;
          if (l.endTime && next && next.startTime) {
            pitSec = (new Date(next.startTime) - new Date(l.endTime)) / 1000;
          } else if (l.endTime && !next && c.inPit && i === runner.legs.length - 1) {
            pitSec = c.currentPitSeconds;
          }
          const pitCell = pitSec != null
            ? fmtShortDuration(pitSec) + (next ? '' : ' <span style="color: var(--accent); font-size: 9px;">●</span>')
            : '—';
          const markers = [];
          if (l.markedOutBy) markers.push(`out by ${l.markedOutBy}`);
          if (l.markedInBy) markers.push(`in by ${l.markedInBy}`);
          if (l.intakeBy && l.intakeBy !== l.markedInBy && l.intakeBy !== l.markedOutBy) markers.push(`intake by ${l.intakeBy}`);
          const markerTag = markers.length ? `<span style="color: var(--text-muted);">${markers.join(' · ')}</span>` : '';
          const noteParts = [l.gearChanges, l.meds, l.issues, l.notes, markerTag].filter(Boolean);
          const isOld = ((runner.legs || []).length - 1 - i) >= 2;
          const oldCls = isOld ? ' leg-old' : '';
          const noteOldCls = isOld ? ' note-old' : '';
          const noteRow = noteParts.length
            ? `<tr class="note-row${noteOldCls}"><td colspan="8">${noteParts.join(' · ')}</td></tr>`
            : '';
          const route = seg
            ? `<span class="leg-route">${seg.from}<span class="sep">→</span>${seg.to}</span>`
            : '—';
          return `
            <tr class="leg-route-row${oldCls}">
              <td class="leg-num" rowspan="2">${l.leg}</td>
              <td colspan="7">${route}</td>
            </tr>
            <tr class="leg-row${oldCls}">
              <td class="num">${seg ? seg.distance : '—'}</td>
              <td class="num">${fmtClockTime(l.endTime)}</td>
              <td class="num">${dur ? fmtShortDuration(dur) : '—'}</td>
              <td class="num">${fmtPace(pace)}</td>
              <td class="num">${pitCell}</td>
              <td class="num">${l.calories || 0}</td>
              <td class="num">${l.fluidOz || 0}oz</td>
            </tr>
            ${noteRow}
          `;
        }).join('');

    const lastLegRouteTxt = c.lastLegSec != null
      ? (course[(runner.legs || []).filter(l => l.startTime && l.endTime).slice(-1)[0].leg - 1] || {}).to
      : null;

    const nextCutoffSub = c.nextCutoff
      ? `${c.nextCutoff.seg.to} · ${fmtClockTimeWithDay(c.nextCutoff.atIso, race.startTime)}`
      : 'none ahead';
    const cutoffSec = race.totalCutoffHours * 3600;
    const bufferSec = c.projectedFinishSec != null ? cutoffSec - c.projectedFinishSec : null;
    const bufferTxt = bufferSec != null
      ? (bufferSec >= 0 ? '+' : '−') + fmtShortDuration(Math.abs(bufferSec))
      : '—';

    return `
      <article class="runner">
        <div class="runner-head">
          <div>
            <div class="runner-name">${runner.name}</div>
            <div class="runner-bib">Bib · ${runner.bib}</div>
          </div>
          <span class="status-badge status-${c.status}">${statusLabel(c.status)}</span>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">Legs</span>
            <span class="value">${c.legsDone}<span style="color: var(--text-muted); font-size: 14px;">/${totalLegs}</span></span>
            <span class="sub">${c.milesDone.toFixed(1)} / ${c.milesTotal} mi</span>
          </div>
          <div class="stat">
            <span class="label">Race Time</span>
            <span class="value live-timer" data-base="${c.completedRaceSeconds}" data-since="${c.liveSince || ''}">${fmtDuration(c.raceSeconds)}</span>
            <span class="sub">of ${race.totalCutoffHours}:00:00</span>
          </div>
          <div class="stat${c.inProgressLeg ? ' live' : ''}">
            <span class="label">Course Total</span>
            <span class="value live-timer" data-base="${c.completedCourseSeconds}" data-since="${c.inProgressLeg ? (c.liveSince || '') : ''}">${fmtDuration(c.totalCourseSeconds)}</span>
            <span class="sub">${c.inProgressLeg ? 'on course' : 'running total'}</span>
          </div>
          <div class="stat${c.inPit ? ' live' : ''}">
            <span class="label">Aid Total</span>
            <span class="value live-timer" data-base="${c.completedPitSeconds}" data-since="${c.inPit ? (c.liveSince || '') : ''}">${fmtDuration(c.totalPitSeconds)}</span>
            <span class="sub">${c.inPit ? 'at aid now' : (c.avgPit != null ? 'avg ' + fmtShortDuration(c.avgPit) : 'no stops yet')}</span>
          </div>
          ${(() => {
            let liveCls = '', liveValue = '—', liveSub;
            if (c.inProgressLeg) {
              liveCls = ' live-course';
              liveValue = fmtDuration(c.currentLegSeconds);
              const seg = course[c.liveLegNumber - 1];
              liveSub = seg ? `Leg ${seg.leg} · → ${seg.to}` : `Leg ${c.liveLegNumber} on course`;
            } else if (c.inPit) {
              liveCls = ' live-pit';
              liveValue = fmtDuration(c.currentPitSeconds);
              const seg = course[c.liveLegNumber - 1];
              liveSub = seg ? `At ${seg.to}` : `At aid · after leg ${c.liveLegNumber}`;
            } else if (c.finished) {
              liveSub = 'finished';
            } else {
              liveSub = c.legsDone === 0 ? 'not started' : 'idle';
            }
            return `
              <div class="stat${liveCls}">
                <span class="label">Live</span>
                <span class="value live-timer" data-base="0" data-since="${c.liveSince || ''}">${liveValue}</span>
                <span class="sub">${liveSub}</span>
              </div>`;
          })()}
          <div class="stat">
            <span class="label">Pace</span>
            <span class="value">${fmtPace(c.avgPaceSecPerMile)}</span>
            <span class="sub">min/mi avg</span>
          </div>
          <div class="stat">
            <span class="label">Last Leg</span>
            <span class="value">${fmtPace(c.lastLegPace)}</span>
            <span class="sub">${c.lastLegSec != null ? fmtShortDuration(c.lastLegSec) + ' · ' + (c.lastLegDistance || '—') + 'mi' : '—'}</span>
          </div>
          <div class="stat">
            <span class="label">Cutoff Buffer</span>
            <span class="value">${bufferTxt}</span>
            <span class="sub">${nextCutoffSub}</span>
          </div>
        </div>

        <div class="intake">
          <div class="intake-title">Intake / Hour (on course)</div>
          <div class="intake-row">
            <span class="name">Calories</span>
            <div class="bar-track"><div class="bar-fill ${intakeClass(c.calPerHr, t.caloriesPerHour)}" style="width: ${Math.min(100, (c.calPerHr / t.caloriesPerHour) * 100)}%"></div></div>
            <span class="num">${Math.round(c.calPerHr)}</span>
            <span class="target">/ ${t.caloriesPerHour}</span>
          </div>
          <div class="intake-row">
            <span class="name">Fluid</span>
            <div class="bar-track"><div class="bar-fill ${intakeClass(c.fluidPerHr, t.fluidOzPerHour)}" style="width: ${Math.min(100, (c.fluidPerHr / t.fluidOzPerHour) * 100)}%"></div></div>
            <span class="num">${c.fluidPerHr.toFixed(1)} oz</span>
            <span class="target">/ ${t.fluidOzPerHour} oz</span>
          </div>
          <div class="intake-row">
            <span class="name">Sodium</span>
            <div class="bar-track"><div class="bar-fill ${intakeClass(c.sodiumPerHr, t.sodiumMgPerHour)}" style="width: ${Math.min(100, (c.sodiumPerHr / t.sodiumMgPerHour) * 100)}%"></div></div>
            <span class="num">${Math.round(c.sodiumPerHr)} mg</span>
            <span class="target">/ ${t.sodiumMgPerHour} mg</span>
          </div>
        </div>

        <div class="legs">
          <div class="legs-head">
            <span class="legs-title">Leg Status</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted);">
              ${c.legsDone} done · ${totalLegs - c.legsDone} to go
            </span>
          </div>
          <div class="legs-grid">${legCells}</div>
          <div class="leglog ${leglogCollapsed(runner.id, (runner.legs || []).length) ? 'collapsed' : ''}" data-runner="${runner.id}">
            ${(runner.legs || []).length > 2 ? `
              <div class="leglog-head" data-action="toggle-leglog" data-runner="${runner.id}">
                <span class="leglog-head-title">Leg Log</span>
                <span class="leglog-head-toggle">
                  <span class="when-collapsed">Show all ${runner.legs.length}</span>
                  <span class="when-expanded">Show recent 2</span>
                </span>
              </div>
            ` : ''}
            <table>
              <thead>
                <tr>
                  <th>#</th><th class="num">Mi</th><th class="num">Done</th>
                  <th class="num">Time</th><th class="num">Pace</th><th class="num">Aid</th>
                  <th class="num">Cal</th><th class="num">Fluid</th>
                </tr>
              </thead>
              <tbody>${legRows}</tbody>
            </table>
          </div>
        </div>
      </article>
    `;
  }

  function tick() {
    if (!raceData) return;
    const now = new Date();
    const clockEl = document.getElementById('clock-now');
    if (clockEl) {
      clockEl.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
    }
    const start = new Date(raceData.race.startTime);
    const cutoffSec = (raceData.race.totalCutoffHours || 38) * 3600;
    let diff = Math.floor((now - start) / 1000);
    const el = document.getElementById('elapsed');
    const label = document.getElementById('elapsed-label');
    if (diff < 0) {
      const until = -diff;
      const d = Math.floor(until / 86400);
      const h = Math.floor((until % 86400) / 3600);
      const m = Math.floor((until % 3600) / 60);
      const s = Math.floor(until % 60);
      label.textContent = 'Race Starts In';
      el.textContent = `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
      el.style.color = 'var(--text-muted)';
    } else {
      const capped = Math.min(diff, cutoffSec);
      label.textContent = 'Race Time Elapsed';
      el.textContent = fmtDuration(capped);
      el.style.color = capped >= cutoffSec ? 'var(--red)' : 'var(--text)';
    }
    document.querySelectorAll('.live-timer').forEach(t => {
      const since = t.dataset.since;
      if (!since) return;
      const base = parseFloat(t.dataset.base) || 0;
      const seconds = base + Math.max(0, (Date.now() - new Date(since).getTime()) / 1000);
      t.textContent = fmtDuration(seconds);
    });
    const cd = document.getElementById('next-cutoff-countdown');
    if (cd && cd.dataset.target) {
      const remaining = Math.floor((new Date(cd.dataset.target) - now) / 1000);
      const vEl = cd.querySelector('.v');
      if (remaining <= 0) {
        vEl.textContent = 'PASSED';
        cd.classList.remove('warn');
        cd.classList.add('danger');
      } else {
        const d = Math.floor(remaining / 86400);
        const h = Math.floor((remaining % 86400) / 3600);
        const m = Math.floor((remaining % 3600) / 60);
        const s = Math.floor(remaining % 60);
        vEl.textContent = d > 0
          ? `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m`
          : `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        cd.classList.toggle('warn', remaining < 3600);
      }
    }
  }

  async function load() {
    try {
      const res = await fetch('data.json?_=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
      });
      if (!res.ok) throw new Error('Failed to load data.json');
      raceData = await res.json();
      lastFetchAt = new Date();
      const course = buildCourseIndex(raceData.race);
      const computed = raceData.runners.map(r => computeRunner(r, raceData.race, course));
      document.getElementById('course-meta').textContent =
        `· ${course.length} legs · ${raceData.race.totalDistance} mi · +${raceData.race.totalGainFt.toLocaleString()} ft`;
      document.getElementById('race-date').textContent = '· ' +
        new Date(raceData.race.startTime).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      renderCutoffs(raceData.race, course, computed[0]);
      document.getElementById('runners').innerHTML =
        raceData.runners.map(r => renderRunner(r, raceData.race, course)).join('');
      renderRaceStats(raceData.race, course);
      document.getElementById('error').style.display = 'none';
      updateLastUpdatedLabel();
      tick();
    } catch (err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').className = 'error-banner';
      document.getElementById('error').textContent = `Error loading race data: ${err.message}`;
    }
  }

  function updateLastUpdatedLabel() {
    if (!raceData) return;
    const lu = raceData.lastUpdated
      ? `Data updated ${new Date(raceData.lastUpdated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
      : 'Awaiting start';
    let live = '';
    if (lastFetchAt) {
      const ago = Math.max(0, Math.floor((Date.now() - lastFetchAt.getTime()) / 1000));
      live = ago < 5 ? ' · live' : ` · checked ${ago}s ago`;
    }
    document.getElementById('last-updated').textContent = lu + live;
  }

  function renderRaceStats(race, course) {
    const el = document.getElementById('race-stats');
    if (!raceData || !raceData.runners || raceData.runners.length === 0) { el.hidden = true; return; }
    const totalLegs = course.length;
    const allFinished = raceData.runners.every(r => {
      const done = (r.legs || []).filter(l => l.startTime && l.endTime).length;
      return done >= totalLegs;
    });
    if (!allFinished) { el.hidden = true; return; }
    el.hidden = false;

    const stats = raceData.runners.map(r => {
      const completed = (r.legs || []).filter(l => l.startTime && l.endTime);
      const cal = completed.reduce((a, l) => a + (l.calories || 0), 0);
      const fluidOz = completed.reduce((a, l) => a + (l.fluidOz || 0), 0);
      const sodium = completed.reduce((a, l) => a + (l.sodiumMg || 0), 0);
      const start = new Date(completed[0].startTime);
      const end = new Date(completed[completed.length - 1].endTime);
      const totalSec = (end - start) / 1000;
      const courseSec = completed.reduce((a, l) =>
        a + (new Date(l.endTime) - new Date(l.startTime)) / 1000, 0);
      const pitSec = totalSec - courseSec;
      return { runner: r, cal, fluidOz, sodium, totalSec, courseSec, pitSec };
    });

    const fmtH = sec => {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return `${h}h ${m}m`;
    };
    const ozToL = oz => (oz * 0.0295735).toFixed(1);

    const s = stats[0];
    el.innerHTML = `
      <div class="subtitle">Finished · ${race.totalDistance} mi · ${course.length} legs · +${race.totalGainFt.toLocaleString()} ft</div>
      <h2>The Race · in <em>Numbers</em></h2>
      <ul>
        <li><strong>${s.cal.toLocaleString()} cal</strong> consumed over ${course.length} legs. Estimated burn for a 100-miler with ~19k ft of climbing is around <strong>14,000–16,000 cal</strong> — a real deficit, eaten back in the days after.</li>
        <li><strong>${ozToL(s.fluidOz)} L</strong> of fluid through aid stations. High-altitude air is dry — fluid loss runs higher than it feels.</li>
        <li><strong>${(s.sodium/1000).toFixed(1)} g</strong> cumulative sodium. Adult daily recommendation is ~1.5 g — this is many days' worth in one effort.</li>
        <li><strong>${fmtH(s.totalSec)}</strong> total race time — <strong>${fmtH(s.courseSec)}</strong> moving, <strong>${fmtH(s.pitSec)}</strong> at aid stations.</li>
      </ul>
    `;
  }

  const LEGLOG_KEY = 'dashboard-leglog-collapsed-v1';
  function loadLeglogState() {
    try { return JSON.parse(localStorage.getItem(LEGLOG_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function saveLeglogState(s) {
    try { localStorage.setItem(LEGLOG_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function leglogCollapsed(runnerId, legCount) {
    if (legCount <= 2) return false;
    const s = loadLeglogState();
    return s[runnerId] !== false;
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action="toggle-leglog"]');
    if (!t) return;
    const id = t.dataset.runner;
    const log = t.closest('.leglog');
    if (!log) return;
    const nowCollapsed = !log.classList.contains('collapsed');
    log.classList.toggle('collapsed', nowCollapsed);
    const s = loadLeglogState();
    s[id] = nowCollapsed;
    saveLeglogState(s);
  });

  document.getElementById('print-btn').addEventListener('click', () => {
    window.open('print-report.html', '_blank');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') load();
  });

  function showPitLinkIfConnected() {
    try {
      const cfg = JSON.parse(localStorage.getItem('pit-board-config-v1') || 'null');
      if (cfg && cfg.token) document.getElementById('pit-link').hidden = false;
    } catch (e) {}
  }
  showPitLinkIfConnected();

  load();
  setInterval(tick, 1000);
  setInterval(updateLastUpdatedLabel, 1000);
  setInterval(load, REFRESH_MS);
</script>

</body>
</html>
